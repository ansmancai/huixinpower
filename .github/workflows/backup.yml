name: Database Backup

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install xlsx
      
      - name: Run backup script
        run: node .github/scripts/backup.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      
      - name: Send email with backup
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 数据备份报告 - ${{ github.run_number }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            备份时间：${{ github.event.head_commit.timestamp }}
            备份内容：projects, suppliers, purchases, invoices, transactions 共5个表
            附件为 Excel 格式，可直接打开查看
          attachments: 电力财务系统备份_*.xlsx