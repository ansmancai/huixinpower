<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>百度OCR测试 - 发票PDF + 付款截图</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 20px; }
        .upload-area { border: 2px dashed #ccc; border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; }
        .paste-area { border: 2px dashed #3b82f6; border-radius: 12px; padding: 30px; text-align: center; background: #f0f9ff; margin-top: 20px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 16px; }
        pre { background: #f3f4f6; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; margin-top: 16px; }
        .result { margin-top: 20px; }
        .loading { display: none; color: #666; margin-top: 16px; }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid #e5e7eb; }
        .tab { padding: 10px 20px; cursor: pointer; border-radius: 8px 8px 0 0; }
        .tab.active { background: #3b82f6; color: white; }
        .tab.inactive { background: #e5e7eb; color: #666; }
        .panel { display: none; }
        .panel.active { display: block; }
        .info-box { background: #e6f7e6; padding: 12px; border-radius: 8px; margin-top: 16px; }
        .warning-box { background: #fff3cd; padding: 12px; border-radius: 8px; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="tab-bar">
        <div class="tab active" data-tab="invoice">📄 发票PDF识别</div>
        <div class="tab inactive" data-tab="payment">💰 付款截图识别（Ctrl+V）</div>
    </div>

    <!-- 发票识别面板 -->
    <div id="invoice-panel" class="panel active">
        <p>测试发票PDF直接识别（不需要转图片）</p>
        <div class="upload-area" id="uploadArea">
            📎 点击或拖拽上传发票PDF
            <input type="file" id="fileInput" accept=".pdf" style="display:none">
        </div>
        <div style="display: flex; gap: 12px; margin-top: 16px;">
            <button id="testBtn" disabled>选择文件后开始识别</button>
        </div>
        <div id="loading" class="loading">识别中，请稍候...</div>
        <div id="result" class="result"></div>
    </div>

    <!-- 付款截图识别面板 -->
    <div id="payment-panel" class="panel">
        <div class="paste-area" id="pasteArea">
            📸 点击此处，然后按 Ctrl+V 粘贴银行付款截图<br>
            <span style="font-size: 12px; color: #666;">支持：网银转账截图、微信/支付宝付款截图</span>
        </div>
        <div id="paymentLoading" class="loading" style="display: none;">识别中，请稍候...</div>
        <div id="paymentResult" class="result"></div>
        <div id="supplierMatch" class="result"></div>
    </div>

    <script>
        // ==================== 通用变量 ====================
        let selectedFile = null;
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const testBtn = document.getElementById('testBtn');
        const loadingDiv = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        
        // 付款截图相关
        const pasteArea = document.getElementById('pasteArea');
        const paymentLoading = document.getElementById('paymentLoading');
        const paymentResult = document.getElementById('paymentResult');
        const supplierMatchDiv = document.getElementById('supplierMatch');

        // Supabase 配置（用于查询供应商）
        const SUPABASE_URL = 'https://sjgyvhceixyukfgplpts.supabase.co';  // 请替换为您的项目URL
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqZ3l2aGNlaXh5dWtmZ3BscHRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNTg5ODcsImV4cCI6MjA4OTkzNDk4N30.1X0OGO5HGF22SHQlAPwDKsBIRW4DzDHWYm-cl6m-9YY';  // 请替换为您的anon密钥

        // ==================== 发票识别（原有功能）====================
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            testBtn.disabled = !selectedFile;
            if (selectedFile) {
                resultDiv.innerHTML = `<div style="background:#e6f7e6; padding:12px; border-radius:8px;">✅ 已选择: ${selectedFile.name}</div>`;
            }
        });

        async function recognizeInvoice(pdfFile) {
            const reader = new FileReader();
            return new Promise((resolve, reject) => {
                reader.onloadend = async () => {
                    const base64 = reader.result.split(',')[1];
                    try {
                        const response = await fetch('/api/ocr-proxy', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ pdf: base64 })
                        });
                        const result = await response.json();
                        resolve(result);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsDataURL(pdfFile);
            });
        }

        testBtn.onclick = async () => {
            if (!selectedFile) return;
            loadingDiv.style.display = 'block';
            resultDiv.innerHTML = '';
            try {
                const result = await recognizeInvoice(selectedFile);
                console.log('识别结果:', result);
                if (result.error_code) {
                    resultDiv.innerHTML = `<div style="background:#fee; padding:12px; border-radius:8px; color:#c00;">
                        ❌ 识别失败: ${result.error_msg} (code: ${result.error_code})<br>
                        ${result.detail ? `详情: ${JSON.stringify(result.detail)}` : ''}
                    </div>`;
                } else {
                    const words = result.words_result || {};
                    resultDiv.innerHTML = `
                        <div style="background:#e6f7e6; padding:12px; border-radius:8px;">
                            <h3>✅ 识别成功</h3>
                            <table style="width:100%; border-collapse:collapse;">
                                <tr><td style="padding:4px">发票号码：</td><td><strong>${words.InvoiceNum || '-'}</strong></td></tr>
                                <tr><td style="padding:4px">开票日期：</td><td><strong>${words.InvoiceDate || '-'}</strong></td></tr>
                                <tr><td style="padding:4px">金额（不含税）：</td><td><strong>${words.TotalAmount || '-'}</strong></td></tr>
                                <tr><td style="padding:4px">税额：</td><td><strong>${words.TotalTax || '-'}</strong></td></tr>
                                <tr><td style="padding:4px">价税合计：</td><td><strong>${words.AmountInFiguers || '-'}</strong></td></tr>
                                <tr><td style="padding:4px">销售方：</td><td><strong>${words.SellerName || '-'}</strong></td></tr>
                                <tr><td style="padding:4px">购买方：</td><td><strong>${words.PurchaserName || '-'}</strong></td></tr>
                            </table>
                            <details style="margin-top:12px">
                                <summary>查看完整数据</summary>
                                <pre style="background:#e5e7eb; padding:8px; overflow:auto; font-size:11px">${JSON.stringify(result, null, 2)}</pre>
                            </details>
                        </div>
                    `;
                }
            } catch (err) {
                resultDiv.innerHTML = `<div style="background:#fee; padding:12px; border-radius:8px; color:#c00;">❌ 请求失败: ${err.message}</div>`;
            } finally {
                loadingDiv.style.display = 'none';
            }
        };

        // ==================== 付款截图识别（新增功能）====================
        
        // 从OCR结果中提取付款关键信息
        function extractPaymentFields(ocrResult) {
    const wordsArray = ocrResult.words_result || [];
    
    let amount = '';
    let date = '';
    let counterpartyName = '';
    let remark = '';
    
    for (let i = 0; i < wordsArray.length; i++) {
        const word = wordsArray[i].words || '';
        
        // 提取金额：找“金额（小写）：”后面的值
        if (word.includes('金额（小写）') || word.includes('金额(小写)')) {
            if (i + 1 < wordsArray.length) {
                amount = wordsArray[i + 1].words || '';
            }
        }
        
        // 提取日期：找“交易日期：”后面的值
        if (word.includes('交易日期')) {
            if (i + 1 < wordsArray.length) {
                date = wordsArray[i + 1].words || '';
            }
        }
        
        // 提取收款方：找“收款人名称：”后面的值
        if (word.includes('收款人名称')) {
            if (i + 1 < wordsArray.length) {
                counterpartyName = wordsArray[i + 1].words || '';
            }
        }
        
        // 提取备注：找“备注：”后面的值
        if (word.includes('备注')) {
            if (i + 1 < wordsArray.length) {
                remark = wordsArray[i + 1].words || '';
            }
        }
    }
    
    // 如果金额包含逗号（如 28,000.00），去掉逗号
    if (amount) {
        amount = amount.replace(/,/g, '');
    }
    
    return { amount, date, counterpartyName, remark };
}
        
        // 匹配供应商
        async function matchSupplier(supplierName) {
            if (!supplierName) return [];
            
            try {
                // 直接调用 supabase 的 REST API（因为 RLS 未设置）
                const response = await fetch(`${SUPABASE_URL}/rest/v1/suppliers?select=id,name&name=ilike.*${encodeURIComponent(supplierName)}*&limit=10`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                if (!response.ok) {
                    console.warn('查询供应商失败，请检查 Supabase 配置');
                    return [];
                }
                const data = await response.json();
                return data;
            } catch (err) {
                console.error('查询供应商出错:', err);
                return [];
            }
        }
        
        // 处理粘贴的图片
        async function handlePasteImage(file) {
            paymentLoading.style.display = 'block';
            paymentResult.innerHTML = '';
            supplierMatchDiv.innerHTML = '';
            
            try {
                // 读取图片为 base64
                const reader = new FileReader();
                const base64 = await new Promise((resolve, reject) => {
                    reader.onloadend = () => {
                        const result = reader.result.split(',')[1];
                        resolve(result);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
                
                // 调用 OCR 接口（传 image 参数）
                const response = await fetch('/api/ocr-proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64 })
                });
                const ocrResult = await response.json();
                console.log('OCR原始结果:', ocrResult);
                
                if (ocrResult.error_code) {
                    paymentResult.innerHTML = `<div class="warning-box">
                        ❌ OCR识别失败: ${ocrResult.error_msg} (code: ${ocrResult.error_code})<br>
                        ${ocrResult.detail ? `详情: ${JSON.stringify(ocrResult.detail)}` : ''}
                    </div>`;
                    return;
                }
                
                // 提取字段
                const { amount, date, counterpartyName, remark, fullText } = extractPaymentFields(ocrResult);
                
                // 显示提取结果
                let resultHtml = `
                    <div class="info-box">
                        <h3>✅ 识别结果</h3>
                        <table style="width:100%; border-collapse:collapse;">
                            <tr><td style="padding:4px">💰 金额：</td><td><strong>${amount || '未识别'}</strong></td></tr>
                            <tr><td style="padding:4px">📅 日期：</td><td><strong>${date || '未识别'}</strong></td></tr>
                            <tr><td style="padding:4px">🏢 收款方：</td><td><strong>${counterpartyName || '未识别'}</strong></td></tr>
                            <tr><td style="padding:4px">📝 备注：</td><td><strong>${remark || '未识别'}</strong></td></tr>
                        </table>
                `;
                
                // 匹配供应商
                if (counterpartyName) {
                    resultHtml += `<div style="margin-top: 12px;"><strong>🔍 正在匹配供应商...</strong></div>`;
                    paymentResult.innerHTML = resultHtml;
                    
                    const matchedSuppliers = await matchSupplier(counterpartyName);
                    
                    if (matchedSuppliers.length === 0) {
                        resultHtml += `<div class="warning-box" style="margin-top: 12px;">
                            ⚠️ 未找到匹配的供应商，请手动选择
                        </div>`;
                    } else if (matchedSuppliers.length === 1) {
                        resultHtml += `<div class="info-box" style="margin-top: 12px; background:#d4edda;">
                            ✅ 匹配到供应商：<strong>${matchedSuppliers[0].name}</strong>（ID: ${matchedSuppliers[0].id}）
                        </div>`;
                    } else {
                        let listHtml = '<ul>';
                        matchedSuppliers.forEach(s => {
                            listHtml += `<li>${s.name}（ID: ${s.id}）</li>`;
                        });
                        listHtml += '</ul>';
                        resultHtml += `<div class="warning-box" style="margin-top: 12px;">
                            ⚠️ 匹配到多个供应商，请手动选择：${listHtml}
                        </div>`;
                    }
                }
                
                resultHtml += `
                            <details style="margin-top:12px">
                                <summary>查看完整OCR数据</summary>
                                <pre style="background:#e5e7eb; padding:8px; overflow:auto; font-size:11px">${JSON.stringify(ocrResult, null, 2)}</pre>
                            </details>
                        </div>
                `;
                paymentResult.innerHTML = resultHtml;
                
            } catch (err) {
                console.error('识别失败:', err);
                paymentResult.innerHTML = `<div class="warning-box">❌ 请求失败: ${err.message}</div>`;
            } finally {
                paymentLoading.style.display = 'none';
            }
        }
        
        // 监听粘贴事件
        pasteArea.addEventListener('click', () => {
            // 聚焦区域，让用户知道可以粘贴
            pasteArea.style.background = '#e6f0ff';
            setTimeout(() => {
                pasteArea.style.background = '#f0f9ff';
            }, 200);
        });
        
        document.addEventListener('paste', async (e) => {
            // 检查当前是否在付款截图面板
            const activeTab = document.querySelector('.tab.active');
            if (!activeTab || activeTab.getAttribute('data-tab') !== 'payment') {
                return; // 不在付款截图面板，不处理
            }
            
            const items = e.clipboardData?.items;
            if (!items) return;
            
            let imageFile = null;
            for (const item of items) {
                if (item.type.indexOf('image') !== -1) {
                    imageFile = item.getAsFile();
                    break;
                }
            }
            
            if (!imageFile) {
                alert('请粘贴图片（截图）');
                return;
            }
            
            e.preventDefault();
            await handlePasteImage(imageFile);
        });

        // ==================== Tab 切换 ====================
        const tabs = document.querySelectorAll('.tab');
        const invoicePanel = document.getElementById('invoice-panel');
        const paymentPanel = document.getElementById('payment-panel');
        
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.getAttribute('data-tab');
                tabs.forEach(t => {
                    t.classList.remove('active');
                    t.classList.add('inactive');
                });
                tab.classList.add('active');
                tab.classList.remove('inactive');
                
                invoicePanel.classList.remove('active');
                paymentPanel.classList.remove('active');
                
                if (targetTab === 'invoice') {
                    invoicePanel.classList.add('active');
                } else {
                    paymentPanel.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
