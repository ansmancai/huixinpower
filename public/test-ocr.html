<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>百度OCR测试 - 直接传PDF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .upload-area { border: 2px dashed #ccc; border-radius: 12px; padding: 30px; text-align: center; cursor: pointer; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 16px; }
        pre { background: #f3f4f6; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; margin-top: 16px; }
        .result { margin-top: 20px; }
        .loading { display: none; color: #666; margin-top: 16px; }
    </style>
</head>
<body>
    <h2>📄 百度OCR测试 - 直接传PDF</h2>
    <p>测试发票PDF直接识别（不需要转图片）</p>

    <div class="upload-area" id="uploadArea">
        📎 点击或拖拽上传发票PDF
        <input type="file" id="fileInput" accept=".pdf" style="display:none">
    </div>
    <div style="display: flex; gap: 12px; margin-top: 16px;">
        <button id="testBtn" disabled>选择文件后开始识别</button>
    </div>
    <div id="loading" class="loading">识别中，请稍候...</div>
    <div id="result" class="result"></div>

    <script>
        let selectedFile = null;
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const testBtn = document.getElementById('testBtn');
        const loadingDiv = document.getElementById('loading');
        const resultDiv = document.getElementById('result');

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            testBtn.disabled = !selectedFile;
            if (selectedFile) {
                resultDiv.innerHTML = `<div style="background:#e6f7e6; padding:12px; border-radius:8px;">✅ 已选择: ${selectedFile.name}</div>`;
            }
        });

        async function recognizeInvoice(pdfFile) {
            const reader = new FileReader();
            return new Promise((resolve, reject) => {
                reader.onloadend = async () => {
                    const base64 = reader.result.split(',')[1];
                    
                    try {
                        const response = await fetch('/api/ocr-proxy', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ image: base64 })
                        });
                        const result = await response.json();
                        resolve(result);
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = reject;
                reader.readAsDataURL(pdfFile);
            });
        }

        testBtn.onclick = async () => {
            if (!selectedFile) return;
            
            loadingDiv.style.display = 'block';
            resultDiv.innerHTML = '';
            
            try {
                const result = await recognizeInvoice(selectedFile);
                console.log('识别结果:', result);
                
                if (result.error_code) {
                    resultDiv.innerHTML = `<div style="background:#fee; padding:12px; border-radius:8px; color:#c00;">
                        ❌ 识别失败: ${result.error_msg} (code: ${result.error_code})<br>
                        ${result.detail ? `详情: ${JSON.stringify(result.detail)}` : ''}
                    </div>`;
                } else {
                    const words = result.words_result || {};
                    resultDiv.innerHTML = `
                        <div style="background:#e6f7e6; padding:12px; border-radius:8px;">
                            <h3>✅ 识别成功</h3>
                            <table style="width:100%; border-collapse:collapse;">
                                <tr><td style="padding:4px">发票号码：</td><td><strong>${words.InvoiceNum?.words || '-'}</strong></td></tr>
                                <tr><td style="padding:4px">开票日期：</td><td>${words.InvoiceDate?.words || '-'}</td></tr>
                                <tr><td style="padding:4px">金额：</td><td>${words.AmountInFiguers?.words || '-'}</td></tr>
                                <tr><td style="padding:4px">税额：</td><td>${words.Tax?.words || '-'}</td></tr>
                                <tr><td style="padding:4px">价税合计：</td><td>${words.TotalAmountInFiguers?.words || '-'}</td></tr>
                                <tr><td style="padding:4px">销售方：</td><td>${words.SellerName?.words || '-'}</td></tr>
                                <tr><td style="padding:4px">购买方：</td><td>${words.BuyerName?.words || '-'}</td></tr>
                            </table>
                            <details style="margin-top:12px">
                                <summary>查看完整数据</summary>
                                <pre style="background:#e5e7eb; padding:8px; overflow:auto; font-size:11px">${JSON.stringify(result, null, 2)}</pre>
                            </details>
                        </div>
                    `;
                }
            } catch (err) {
                resultDiv.innerHTML = `<div style="background:#fee; padding:12px; border-radius:8px; color:#c00;">❌ 请求失败: ${err.message}</div>`;
            } finally {
                loadingDiv.style.display = 'none';
            }
        };
    </script>
</body>
</html>
